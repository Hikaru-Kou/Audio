<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>リハ音量メーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4;--panel:#FFFFFF;--ink:#15202B;--sub:#5B6B7A;--line:#D5DCE3;
  --ok:#2E8B57;--warn:#C98A00;--loud:#D7263D;--idle:#6B7A89;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#121821;--panel:#1B2330;--ink:#E8EDF2;--sub:#93A1AF;--line:#2A3444;--idle:#3E4B5C}
}
:root[data-theme="dark"]{--bg:#121821;--panel:#1B2330;--ink:#E8EDF2;--sub:#93A1AF;--line:#2A3444;--idle:#3E4B5C}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New",system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:16px 16px 32px}
h1{font-size:18px;margin:4px 0 12px;font-weight:700;color:var(--sub)}
.hero{border-radius:22px;padding:20px 22px 22px;color:#fff;background:var(--idle);transition:background .2s}
.hero.ok{background:var(--ok)}.hero.warn{background:var(--warn)}.hero.loud{background:var(--loud)}
.state{font-size:clamp(30px,10vw,52px);font-weight:900;line-height:1.1}
.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;
  font-size:clamp(110px,36vw,200px);line-height:.85;letter-spacing:-.02em;margin-top:6px}
.num small{font-size:.22em;font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;margin-left:6px;letter-spacing:0}
.hero p{margin:10px 0 0;font-size:14px;opacity:.9}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.panel h2{font-size:16px;margin:0 0 10px}
.band{display:grid;grid-template-columns:5.5em 1fr;align-items:center;gap:10px;margin:8px 0}
.band span{font-size:14px;font-weight:700}
.band span em{display:block;font-style:normal;font-weight:500;font-size:11px;color:var(--sub);line-height:1.2}
.track{height:22px;background:var(--line);border-radius:6px;overflow:hidden}
.fill{height:100%;width:0;background:var(--sub);transition:width .1s}
.fill.top{background:var(--loud)}
#bandMsg{font-size:15px;font-weight:700;min-height:1.6em;margin:8px 0 0}
label.row{display:flex;justify-content:space-between;font-size:15px;font-weight:700}
input[type=range]{width:100%;margin:10px 0 4px;accent-color:var(--loud)}
.hint{font-size:12px;color:var(--sub);margin:4px 0 0}
canvas{width:100%;height:110px;display:block;border-radius:8px;background:var(--bg)}
.stats{display:flex;gap:18px;margin-top:10px;font-size:14px}
.stats b{font-family:"Barlow Condensed",sans-serif;font-size:26px;display:block;line-height:1}
.btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
button{font:inherit;font-size:17px;font-weight:700;border:0;border-radius:12px;padding:14px 20px;cursor:pointer;
  background:var(--ink);color:var(--bg);flex:1 1 auto}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
button:focus-visible,input:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.note{font-size:12px;color:var(--sub);margin-top:18px}
#err{color:var(--loud);font-weight:700;font-size:14px;margin-top:10px}
@media (prefers-reduced-motion:reduce){.hero,.fill{transition:none}}
</style>
</head>
<body>
<main>
  <h1>リハ音量メーター</h1>

  <section class="hero" id="hero" aria-live="polite">
    <div class="state" id="state">スタートを押してね</div>
    <div class="num"><span id="num">--</span><small>レベル</small></div>
    <p id="heroSub">赤になったら「今デカすぎ」の合図</p>
  </section>

  <div class="btns">
    <button id="startBtn">計測スタート</button>
    <button id="resetBtn" class="ghost">記録リセット</button>
  </div>
  <div id="err" role="alert"></div>

  <section class="panel">
    <h2>どの音域が出すぎ？</h2>
    <div class="band"><span>低音<em>ベース・キック</em></span><div class="track"><div class="fill" id="b0"></div></div></div>
    <div class="band"><span>中低音<em>ギターの芯・声の太さ</em></span><div class="track"><div class="fill" id="b1"></div></div></div>
    <div class="band"><span>中高音<em>リード・ボーカル</em></span><div class="track"><div class="fill" id="b2"></div></div></div>
    <div class="band"><span>高音<em>シンバル・歪みのジャリ感</em></span><div class="track"><div class="fill" id="b3"></div></div></div>
    <p id="bandMsg"></p>
  </section>

  <section class="panel">
    <label class="row" for="thr"><span>赤になるライン</span><span id="thrVal">90</span></label>
    <input type="range" id="thr" min="60" max="115" step="1" value="90">
    <p class="hint">客席の真ん中で一番いい感じの曲を流して、そのときのレベル＋3くらいに合わせるのがおすすめ</p>
  </section>

  <section class="panel">
    <h2>直近60秒</h2>
    <canvas id="tl" width="600" height="110"></canvas>
    <div class="stats">
      <div><b id="loudSec">0</b>赤の秒数</div>
      <div><b id="peak">--</b>最大レベル</div>
    </div>
  </section>

  <p class="note">スマホのマイクは機種ごとに感度が違うので、表示は正確なdBじゃなく「目安のレベル」です。同じスマホを同じ場所に置いて比べれば、曲ごと・バンドごとの差ははっきり出ます。ステージ前じゃなく客席の真ん中に置くのがコツ。</p>
</main>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const hero=$('hero'),stateEl=$('state'),numEl=$('num'),heroSub=$('heroSub');
  const thr=$('thr'),thrVal=$('thrVal'),startBtn=$('startBtn'),errEl=$('err');
  const fills=[0,1,2,3].map(i=>$('b'+i));
  const bands=[[60,250],[250,1000],[1000,4000],[4000,12000]];
  const bandNames=['低音','中低音','中高音','高音'];
  const bandHint=['ベースかキックがデカいかも','ギターかキーボードの音量過多かも','リードかボーカルが出すぎ','シンバルか歪みがうるさいかも'];

  try{const v=localStorage.getItem('rehThr');if(v)thr.value=v;}catch(e){}
  thrVal.textContent=thr.value;
  thr.addEventListener('input',()=>{thrVal.textContent=thr.value;try{localStorage.setItem('rehThr',thr.value)}catch(e){}});

  let ctx,analyser,stream,raf,wake,running=false;
  let td,fd,lv=0,bandEma=[-100,-100,-100,-100];
  let hist=[],lastPush=0,loudMs=0,peak=0,lastT=0;

  const cv=$('tl'),g=cv.getContext('2d');

  async function start(){
    errEl.textContent='';
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    }catch(e){
      errEl.textContent='マイクが使えません。ブラウザの設定でマイクを許可して、もう一度押してください。';return;
    }
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    const src=ctx.createMediaStreamSource(stream);
    analyser=ctx.createAnalyser();analyser.fftSize=4096;analyser.smoothingTimeConstant=0.6;
    src.connect(analyser);
    td=new Float32Array(analyser.fftSize);fd=new Float32Array(analyser.frequencyBinCount);
    running=true;startBtn.textContent='計測ストップ';
    try{wake=await navigator.wakeLock.request('screen')}catch(e){}
    lastT=performance.now();loop();
  }
  function stop(){
    running=false;cancelAnimationFrame(raf);
    if(stream)stream.getTracks().forEach(t=>t.stop());
    if(ctx)ctx.close();
    try{wake&&wake.release()}catch(e){}
    startBtn.textContent='計測スタート';
    hero.className='hero';stateEl.textContent='停止中';
  }
  startBtn.addEventListener('click',()=>running?stop():start());
  $('resetBtn').addEventListener('click',()=>{hist=[];loudMs=0;peak=0;$('loudSec').textContent='0';$('peak').textContent='--';draw();});

  function loop(){
    raf=requestAnimationFrame(loop);
    const now=performance.now(),dt=now-lastT;lastT=now;
    analyser.getFloatTimeDomainData(td);
    let s=0;for(let i=0;i<td.length;i++)s+=td[i]*td[i];
    const db=20*Math.log10(Math.sqrt(s/td.length)+1e-10);
    const level=Math.max(0,Math.min(130,db+100));
    lv = level>lv ? lv*0.5+level*0.5 : lv*0.9+level*0.1;

    const t=+thr.value;let st;
    if(lv>=t){st='loud';loudMs+=dt;}else if(lv>=t-6)st='warn';else st='ok';
    hero.className='hero '+st;
    stateEl.textContent=st==='loud'?'デカすぎ！':st==='warn'?'ギリギリ':'ちょうどいい';
    heroSub.textContent=st==='loud'?'音量を下げて。特に下の赤い音域':'赤になったら「今デカすぎ」の合図';
    numEl.textContent=Math.round(lv);
    if(lv>peak)peak=lv;

    analyser.getFloatFrequencyData(fd);
    const hz=ctx.sampleRate/analyser.fftSize;
    const cur=bands.map(([a,b])=>{let p=0;for(let i=Math.floor(a/hz);i<=Math.ceil(b/hz)&&i<fd.length;i++)p+=Math.pow(10,fd[i]/10);return 10*Math.log10(p+1e-12)});
    bandEma=bandEma.map((v,i)=>v*0.85+cur[i]*0.15);
    const mx=Math.max(...bandEma);
    let top=bandEma.indexOf(mx);
    const others=bandEma.filter((_,i)=>i!==top);
    const avgOthers=10*Math.log10(others.reduce((a,v)=>a+Math.pow(10,v/10),0)/others.length);
    const stickOut=mx-avgOthers>7 && lv>t-10;
    fills.forEach((f,i)=>{
      const w=Math.max(0,Math.min(100,(bandEma[i]-mx+30)/30*100));
      f.style.width=w+'%';f.classList.toggle('top',stickOut&&i===top);
    });
    $('bandMsg').textContent=stickOut?bandNames[top]+'が突出 → '+bandHint[top]:'';

    if(now-lastPush>100){lastPush=now;hist.push(lv);if(hist.length>600)hist.shift();
      $('loudSec').textContent=Math.round(loudMs/1000);$('peak').textContent=Math.round(peak);draw();}
  }

  function draw(){
    const W=cv.width,H=cv.height,cs=getComputedStyle(document.documentElement);
    g.clearRect(0,0,W,H);
    const lo=40,hi=120,y=v=>H-(Math.max(lo,Math.min(hi,v))-lo)/(hi-lo)*H,t=+thr.value;
    const bw=W/600;
    hist.forEach((v,i)=>{
      g.fillStyle=v>=t?cs.getPropertyValue('--loud'):v>=t-6?cs.getPropertyValue('--warn'):cs.getPropertyValue('--ok');
      g.fillRect(W-(hist.length-i)*bw,y(v),Math.ceil(bw),H-y(v));
    });
    g.strokeStyle=cs.getPropertyValue('--loud');g.setLineDash([6,4]);g.lineWidth=2;
    g.beginPath();g.moveTo(0,y(t));g.lineTo(W,y(t));g.stroke();g.setLineDash([]);
  }
  draw();
})();
</script>
</body>
</html>
